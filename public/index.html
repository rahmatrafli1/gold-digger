<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GoldDigger</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Saira+Stencil+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <h1 class="logo">GoldDigger</h1>

      <img src="gold.png" alt="Gold bars" class="gold-image" />

      <div class="field">
        <label>
          <span id="statusLabel">Disconnected</span>
          <span id="statusDot" class="dot dot-red"></span>
        </label>
        <div class="price-box" id="priceBox">Rp----.-- / Oz*</div>
      </div>

      <div class="field">
        <label>Amount to invest</label>
        <div class="amount-box">
          <span class="currency">Rp</span>
          <input type="number" id="amountInput" placeholder="100000" disabled />
        </div>
      </div>

      <button id="investBtn" class="invest-btn" disabled>Invest Now!</button>

      <p class="footnote">* 1oz = 1 troy ounce of 24 Carat Gold</p>
    </div>

    <!-- Popup Summary -->
    <div id="overlay" class="overlay hidden">
      <div class="popup">
        <h2>Summary</h2>
        <p id="summaryText"></p>
        <button id="okBtn" class="ok-btn">OK</button>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
